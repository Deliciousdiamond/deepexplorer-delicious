<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>网络连接超时</title>
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --text: #1F1F1F;
    --muted: #5F6368;
    --primary: #1A73E8;
    --error: #D93025;
    --error-soft: #FCE8E6;
    --border: #DADCE0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B0B0F;
      --surface: #0F0F13;
      --text: #E8EAED;
      --muted: #9AA0A6;
      --primary: #8AB4F8;
      --error: #F28B82;
      --error-soft: #2A1513;
      --border: #3C4043;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Roboto", "Noto Sans SC", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 380px;
    padding: 24px;
    border-radius: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: none;
  }
  .icon {
    width: 40px;
    height: 40px;
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--error-soft);
    color: var(--error);
    margin-bottom: 16px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 20px;
    line-height: 1.4;
    font-weight: 500;
  }
  p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.65;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 24px;
  }
  button {
    appearance: none;
    border: 0;
    border-radius: 0;
    background: var(--primary);
    color: #FFFFFF;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 18px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(0.97); }
  .brand {
    margin-top: 28px;
    color: var(--muted);
    font-size: 10.5px;
    letter-spacing: 0;
    opacity: 0.55;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M6 6L18 18M18 6L6 18"/>
      </svg>
    </div>
    <h1>网络连接超时</h1>
    <p>无法连接到该网站。请检查您的代理或防火墙设置。</p>
    <div class="actions">
      <button type="button" onclick="retryFromErrorPage()">重试</button>
    </div>
    <div class="brand">深探</div>
  </main>
  <script>
    function retryFromErrorPage() {
      try {
        if (window.ErrorPage && typeof window.ErrorPage.retry === 'function') {
          window.ErrorPage.retry();
        }
      } catch (e) { }
    }
  </script>
</body>
</html>
